<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171b19" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Record what you just finished with one tap. DailyKarte is a simple activity-card journal.">
  <title>DailyKarte · Your day, recorded</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="styles.css?v=20261109-merged">
  <script type="module" src="app.js?v=20261109-merged"></script>
</head>
<body>
  <a class="skip-link" href="#login-title">Skip to content</a>
  <main class="login-screen" id="login-screen" aria-labelledby="login-title">
    <header class="login-header"><a class="brand" href="#login" aria-label="DailyKarte home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>DailyKarte</a></header>
    <section class="login-panel">
      <h1 id="login-title" tabindex="-1">Remember your day.</h1>
      <p class="login-description">Tap an activity card to record what you just finished.</p>
      <button class="google-sign-in" id="google-sign-in" data-action="sign-in" aria-describedby="login-status" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.12H3.05v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 13.92a6 6 0 0 1 0-3.84V7.49H3.05a10 10 0 0 0 0 9.02l3.35-2.59Z"/><path fill="#EA4335" d="M12 5.96c1.47 0 2.79.51 3.82 1.51l2.87-2.87A9.58 9.58 0 0 0 12 2a10 10 0 0 0-8.95 5.49l3.35 2.59A5.99 5.99 0 0 1 12 5.96Z"/></svg><span id="google-sign-in-label">Continue with Google</span></button>
      <p class="login-sync-note">You can sign in to keep your records across devices.</p>
      <p class="login-status" id="login-status" role="status" aria-live="polite" hidden></p>
      <footer class="login-footer"><button id="guest-entry" data-action="guest-entry">Try as a guest</button><p>Guest records reset when you leave or refresh.</p></footer>
    </section>
  </main>
  <div class="app-shell" id="workspace" hidden>
    <aside class="sidebar">
      <a class="brand" href="#today" aria-label="DailyKarte home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>DailyKarte</a>
      <nav class="desktop-nav" aria-label="Main navigation" id="desktop-nav"></nav>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <a class="brand mobile-brand" href="#today">DailyKarte</a>
        <strong id="breadcrumb">Your day</strong>
        <button class="text-button" id="demo-toggle">Try a sample day</button>
      </header>
      <section class="account-strip" id="account-strip" aria-label="Account and sync status" aria-live="polite"></section>
      <main id="main" tabindex="-1">
        <div class="page-heading"><h1 id="page-title">Your day</h1><p class="page-description" id="page-description">Record what you just finished.</p></div>
        <section class="date-toolbar" aria-label="Record date"><div class="date-selector"><button class="icon-button" id="prev-day" aria-label="Previous day"></button><button class="selected-date" id="selected-date"></button><button class="icon-button" id="next-day" aria-label="Next day"></button><input id="date-picker" type="date" aria-label="Choose a date" class="date-picker-input"></div><button class="today-link" id="go-today">Today</button></section>
        <section class="summary-strip" aria-label="Daily summary" id="summary-strip"></section>
        <div id="view-content"></div>
      </main>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="Mobile navigation" id="mobile-nav" hidden></nav>
  <dialog id="editor" aria-labelledby="editor-title"><div class="sheet-header"><h2 id="editor-title">Edit record</h2><button class="icon-button" id="close-editor" aria-label="Close editor"></button></div><div id="editor-content"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
  <noscript><p class="noscript">Please enable JavaScript to record activities.</p></noscript>
</body>
</html>
