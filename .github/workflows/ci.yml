name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Install Web package dependency
        run: npm --prefix web ci --ignore-scripts
      - name: Generate development output
        run: npm run build:web:local
      - name: Lint source
        run: npm run lint
      - name: Check JavaScript syntax
        run: npm run check
      - name: Check generated browser modules
        run: npm run check:generated
      - name: Test application behavior
        run: npm test
      - name: Check public release files
        run: npm run check:release
      - name: Check npm package and consumer compatibility
        run: node scripts/check-package.mjs
      - name: Verify Web release build
        run: npm run build:web && npm run check:web:release
      - name: Audit development dependencies
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org
